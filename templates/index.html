<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やんわりNO – 断り文ジェネレーター</title>
  <meta name="description" content="状況を選ぶだけで自然な断り文をAIが生成。飲み会・合コン・バイトシフトなどあらゆるシーンに対応。" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #5B4FE9;
      --accent-hover: #4840C8;
      --accent-pale:  #EEECFD;
      --bg:           #F6F6F9;
      --surface:      #FFFFFF;
      --border:       #E4E4EC;
      --text:         #111118;
      --muted:        #7A7A90;
      --danger:       #DC2626;
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .logo-text { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
    .logo-sub  {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ─── Main ─── */
    .main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* ─── Section block ─── */
    .block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .block-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .block-label span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: var(--accent-pale);
      color: var(--accent);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    /* ─── Chip group ─── */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      padding: 7px 14px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .chip.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ─── Textarea ─── */
    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      color: var(--text);
      outline: none;
      background: var(--bg);
      transition: border-color .15s, background .15s;
      line-height: 1.6;
    }
    textarea:focus { border-color: var(--accent); background: #fff; }
    textarea::placeholder { color: var(--muted); }

    /* ─── Generate button ─── */
    .btn-gen {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: var(--text);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .08s;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 12px;
    }
    .btn-gen:hover:not(:disabled) { background: #2a2a38; }
    .btn-gen:active:not(:disabled) { transform: scale(.985); }
    .btn-gen:disabled { opacity: .55; cursor: not-allowed; }

    /* ─── Spinner ─── */
    .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error banner ─── */
    .error-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--danger);
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* ─── Results ─── */
    .results-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin: 4px 0 12px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 10px;
      position: relative;
    }
    .result-card::before {
      content: '';
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .result-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-pale);
      padding: 3px 9px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 10px;
      letter-spacing: .3px;
    }

    .result-text {
      font-size: 14.5px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-copy {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
      display: flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.done  { background: var(--accent-pale); border-color: var(--accent); color: var(--accent); }

    /* ─── Action row ─── */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-x {
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #0f0f0f;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-x:hover { background: #2a2a2a; }

    .btn-retry {
      padding: 13px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── Footer ─── */
    .site-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px;
    }
    .site-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

    /* ─── Utility ─── */
    .hidden { display: none !important; }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #111;
      color: #fff;
      padding: 11px 20px;
      border-radius: 100px;
      font-size: 13px; font-weight: 600;
      z-index: 99;
      transition: transform .25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="logo-mark">🙅</div>
  <span class="logo-text">やんわりNO</span>
  <span class="logo-sub">断り文ジェネレーター</span>
</header>

<!-- Main -->
<main class="main">

  <!-- Situation -->
  <div class="block">
    <div class="block-label"><span>1</span> 断りたいシチュエーション</div>
    <div class="chips" id="sit-chips">
      <button class="chip" data-g="situation" data-v="nomikai"     onclick="pick(this)">飲み会・食事会</button>
      <button class="chip" data-g="situation" data-v="goukon"      onclick="pick(this)">合コン・デート</button>
      <button class="chip" data-g="situation" data-v="shift"       onclick="pick(this)">バイトシフト交代</button>
      <button class="chip" data-g="situation" data-v="nijikai"     onclick="pick(this)">2次会・3次会</button>
      <button class="chip" data-g="situation" data-v="event"       onclick="pick(this)">イベント・勉強会</button>
      <button class="chip" data-g="situation" data-v="date"        onclick="pick(this)">個人的なお出かけ</button>
      <button class="chip" data-g="situation" data-v="other"       onclick="pick(this)">その他</button>
    </div>
  </div>

  <!-- Relationship -->
  <div class="block">
    <div class="block-label"><span>2</span> 相手との関係</div>
    <div class="chips" id="rel-chips">
      <button class="chip" data-g="relationship" data-v="friend"       onclick="pick(this)">友達・同期</button>
      <button class="chip" data-g="relationship" data-v="senpai"       onclick="pick(this)">先輩・上司</button>
      <button class="chip" data-g="relationship" data-v="kouhai"       onclick="pick(this)">後輩・部下</button>
      <button class="chip" data-g="relationship" data-v="acquaintance" onclick="pick(this)">あまり親しくない人</button>
      <button class="chip" data-g="relationship" data-v="other"        onclick="pick(this)">その他</button>
    </div>
  </div>

  <!-- Details -->
  <div class="block">
    <div class="block-label"><span>3</span> 補足情報 <span style="font-weight:500;color:var(--muted);background:none;color:var(--muted);font-size:11px;">任意</span></div>
    <textarea id="details" rows="2"
      placeholder="例：先週も断った、どうしても行きたくない雰囲気を出したくない、など"></textarea>
  </div>

  <!-- Error banner (hidden by default) -->
  <div class="error-banner hidden" id="err-banner"></div>

  <!-- Generate -->
  <button class="btn-gen" id="btn-gen" onclick="generate()">
    <div class="spin hidden" id="spin"></div>
    <span id="btn-label">断り文を生成する →</span>
  </button>

  <!-- Results -->
  <div id="results" class="hidden">
    <div class="results-label">生成完了 ↓</div>

    <div class="result-card" id="card-1">
      <span class="result-tag">さらりと断る系</span>
      <div class="result-text" id="text-1"></div>
      <div class="card-footer">
        <button class="btn-copy" id="cp-1" onclick="copy(1)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          コピー
        </button>
      </div>
    </div>

    <div class="result-card" id="card-2">
      <span class="result-tag">気持ち重視系</span>
      <div class="result-text" id="text-2"></div>
      <div class="card-footer">
        <button class="btn-copy" id="cp-2" onclick="copy(2)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          コピー
        </button>
      </div>
    </div>

    <div class="result-card" id="card-3">
      <span class="result-tag">次につなげる系</span>
      <div class="result-text" id="text-3"></div>
      <div class="card-footer">
        <button class="btn-copy" id="cp-3" onclick="copy(3)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          コピー
        </button>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-x" onclick="shareX()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Xでシェア
      </button>
      <button class="btn-retry" onclick="generate()">🔄 再生成</button>
    </div>
  </div>

</main>

<footer class="site-footer">
  made by <a href="https://twitter.com/ai_jikken10man" target="_blank">@ai_jikken10man</a> × Claude AI
</footer>

<div class="toast" id="toast"></div>

<script>
  const sel = { situation: null, relationship: null };

  function pick(el) {
    const g = el.dataset.g;
    document.querySelectorAll(`.chip[data-g="${g}"]`).forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    sel[g] = el.dataset.v;
  }

  function showError(msg) {
    const el = document.getElementById('err-banner');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function hideError() {
    document.getElementById('err-banner').classList.add('hidden');
  }

  async function generate() {
    if (!sel.situation)    { toast('シチュエーションを選んでください'); return; }
    if (!sel.relationship) { toast('相手との関係を選んでください'); return; }

    hideError();

    const btn   = document.getElementById('btn-gen');
    const label = document.getElementById('btn-label');
    const spin  = document.getElementById('spin');
    const res   = document.getElementById('results');

    btn.disabled = true;
    label.textContent = '生成中...';
    spin.classList.remove('hidden');
    res.classList.add('hidden');

    try {
      const r = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          situation:    sel.situation,
          relationship: sel.relationship,
          details:      document.getElementById('details').value,
        }),
      });

      const data = await r.json();

      if (data.success) {
        render(data.result);
        res.classList.remove('hidden');
        res.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        showError(data.error || '生成に失敗しました。もう一度お試しください。');
      }
    } catch (e) {
      showError('通信エラーが発生しました。サーバーが起動しているか確認してください。');
    } finally {
      btn.disabled = false;
      label.textContent = '断り文を生成する →';
      spin.classList.add('hidden');
    }
  }

  function render(text) {
    const defs = [
      { id: 1, key: 'さらりと断る系' },
      { id: 2, key: '気持ち重視系' },
      { id: 3, key: '次につなげる系' },
    ];

    defs.forEach((d, i) => {
      const start = text.indexOf(`【${d.key}】`);
      if (start === -1) { document.getElementById(`card-${d.id}`).style.display = 'none'; return; }

      const afterHeader = start + `【${d.key}】`.length;
      const nextKey = defs[i + 1] ? `【${defs[i+1].key}】` : null;
      const end = nextKey ? text.indexOf(nextKey) : text.length;

      let chunk = text.substring(afterHeader, end !== -1 ? end : text.length);
      chunk = chunk.replace(/^[\s\n]*（[^\n）]*）[\s\n]*/m, '').trim();
      chunk = chunk.replace(/^\[|\]$/g, '').trim();

      const card = document.getElementById(`card-${d.id}`);
      document.getElementById(`text-${d.id}`).textContent = chunk;
      card.style.display = chunk ? 'block' : 'none';

      const cp = document.getElementById(`cp-${d.id}`);
      cp.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピー';
      cp.classList.remove('done');
    });
  }

  function copy(id) {
    const txt = document.getElementById(`text-${id}`).textContent;
    const btn = document.getElementById(`cp-${id}`);
    navigator.clipboard.writeText(txt).then(() => {
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> コピーしました';
      btn.classList.add('done');
      setTimeout(() => {
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピー';
        btn.classList.remove('done');
      }, 2000);
    }).catch(() => toast('コピーに失敗しました'));
  }

  function shareX() {
    const labels = { nomikai:'飲み会', goukon:'合コン', shift:'バイトシフト',
                     nijikai:'2次会', event:'イベント', date:'お出かけ', other:'誘い' };
    const sit = labels[sel.situation] || '誘い';
    const t = `${sit}の断り文、AIが一瞬で作ってくれるやつ作った\n\nこういうの欲しかったってなった\n\n🔗 やんわりNO\nhttps://yanwari-no.onrender.com\n\n#やんわりNO`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}`, '_blank');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ページ読み込み時にAPIキーの状態を確認
  fetch('/health').then(r => r.json()).then(d => {
    if (!d.key_set) {
      showError('⚠️ APIキーが設定されていません。.env ファイルに ANTHROPIC_API_KEY を追加してください。');
    }
  }).catch(() => {});
</script>
</body>
</html>
